<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#111111">
<meta name="description" content="InstaFrame - crop and frame photos for Instagram before you upload.">
<title>InstaFrame</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="InstaFrame">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <!-- ============ STEP 0: HOME / SELECT ============ -->
  <section class="screen active" id="screen-select">
    <header class="topbar">
      <h1 class="brand">InstaFrame</h1>
    </header>

    <main class="center-stage">
      <div class="empty-state">
        <svg viewBox="0 0 24 24" class="empty-icon" fill="none" stroke="currentColor" stroke-width="1.4">
          <rect x="3" y="5" width="18" height="14" rx="2"/>
          <circle cx="8.5" cy="10" r="1.5"/>
          <path d="M21 16l-5-5-4 4-2-2-5 5"/>
        </svg>
        <p class="empty-title">Frame your shots<br>before you post</p>
        <p class="empty-sub">Pick 1:1 or 4:5, straighten &amp; crop, add a border — then export straight to your library.</p>
      </div>

      <input type="file" id="fileInput" accept="image/*" multiple hidden>
      <button class="btn-primary btn-large" id="btnSelectImages">Select Images</button>
    </main>
  </section>

  <!-- ============ STEP 1a: MODE (individual / batch) ============ -->
  <section class="screen" id="screen-mode">
    <header class="topbar">
      <button class="icon-btn" id="btnModeBack" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 class="brand">Edit Mode</h1>
    </header>

    <main class="center-stage">
      <p class="step-hint" id="modeCount">0 images selected</p>

      <div class="thumb-strip" id="modeThumbStrip"></div>

      <div class="choice-cards">
        <button class="choice-card" id="btnModeIndividual">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
          <span class="choice-title">Edit individually</span>
          <span class="choice-sub">Crop, straighten &amp; frame each photo yourself</span>
        </button>
        <button class="choice-card" id="btnModeBatch">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg>
          <span class="choice-title">Batch edit</span>
          <span class="choice-sub">Auto-crop everything the same way, then apply one frame &amp; colour to all</span>
        </button>
      </div>
    </main>
  </section>

  <!-- ============ STEP 2: STRAIGHTEN / ROTATE / CROP ============ -->
  <section class="screen" id="screen-crop">
    <header class="topbar">
      <button class="icon-btn" id="btnCropBack" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 class="brand" id="cropTitle">Crop</h1>
      <span class="progress-pill" id="cropProgress"></span>
    </header>

    <main class="crop-stage">
      <div class="canvas-outer" id="canvasOuter">
        <div class="canvas-wrap" id="canvasWrap">
          <canvas id="cropCanvas"></canvas>
          <div class="grid-overlay" id="gridOverlay">
            <div class="grid-line v" style="left:33.333%"></div>
            <div class="grid-line v" style="left:66.666%"></div>
            <div class="grid-line h" style="top:33.333%"></div>
            <div class="grid-line h" style="top:66.666%"></div>
          </div>
        </div>
      </div>

      <div class="ratio-toggle" role="group" aria-label="Crop ratio">
        <button class="seg-btn active" data-ratio="1.3333">4:3</button>
        <button class="seg-btn" data-ratio="0.75">3:4</button>
      </div>

      <div class="control-row">
        <label class="control-label">Straighten</label>
        <input type="range" id="rotateSlider" min="-45" max="45" value="0" step="0.5">
        <span class="control-value" id="rotateValue">0°</span>
      </div>

      <div class="quick-actions">
        <button class="chip" id="btnRotate90">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 12a8 8 0 1 1 3 6.2"/><path d="M4 12V6"/><path d="M4 12h6"/></svg>
          Rotate 90°
        </button>
        <button class="chip" id="btnReset">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 4v6h6"/><path d="M20 20a9 9 0 1 0-3-16.7L4 10"/></svg>
          Reset
        </button>
        <button class="chip highlight" id="btnAutoCrop">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
          Auto crop (rule of thirds)
        </button>
      </div>
    </main>

    <footer class="bottom-bar">
      <button class="btn-secondary" id="btnCropSkipAll">Use same crop for all</button>
      <button class="btn-primary" id="btnCropNext">Next</button>
    </footer>
  </section>

  <!-- ============ STEP 3+4: FRAME RATIO + COLOUR ============ -->
  <section class="screen" id="screen-frame">
    <header class="topbar">
      <button class="icon-btn" id="btnFrameBack" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 class="brand">Frame</h1>
    </header>

    <main class="center-stage">
      <div class="frame-preview-wrap">
        <canvas id="framePreviewCanvas"></canvas>
      </div>

      <p class="section-label">Frame ratio</p>
      <div class="ratio-toggle" role="group" aria-label="Frame ratio">
        <button class="seg-btn active" data-frame="1">1:1 Square</button>
        <button class="seg-btn" data-frame="1.25">4:5 Portrait</button>
      </div>

      <p class="section-label">Frame colour</p>
      <div class="color-toggle" role="group" aria-label="Frame colour">
        <button class="color-swatch active" data-color="#ffffff">
          <span class="swatch white"></span> White
        </button>
        <button class="color-swatch" data-color="#000000">
          <span class="swatch black"></span> Black
        </button>
      </div>
    </main>

    <footer class="bottom-bar">
      <button class="btn-primary" id="btnFrameNext">Next</button>
    </footer>
  </section>

  <!-- ============ STEP 5: EXPORT ============ -->
  <section class="screen" id="screen-export">
    <header class="topbar">
      <button class="icon-btn" id="btnExportBack" aria-label="Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 class="brand">Export</h1>
    </header>

    <main class="center-stage">
      <div class="export-grid" id="exportGrid"></div>
      <p class="step-hint" id="exportSummary"></p>
    </main>

    <footer class="bottom-bar">
      <button class="btn-secondary" id="btnStartOver">Start over</button>
      <button class="btn-primary" id="btnSaveAll">Save to Library</button>
    </footer>
  </section>

  <div class="toast" id="toast"></div>
</div>

<script src="app.js"></script>
</body>
</html>
